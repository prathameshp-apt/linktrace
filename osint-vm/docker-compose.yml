# ---------------------------------------------------------------------
# SearXNG for the OSINT VM -- local-only meta-search backend.
#
# Runs bound to 127.0.0.1 only (not 0.0.0.0): nothing outside this VM
# can ever reach it, which matters since it's aggregating an
# investigator's search queries. LinkTrace's search panel talks to it
# at http://127.0.0.1:8888.
#
# Bring up:   docker compose up -d
# Logs:       docker compose logs -f searxng
# Stop:       docker compose down
# Update:     docker compose pull && docker compose up -d
# ---------------------------------------------------------------------
services:
  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: linktrace-searxng
    restart: unless-stopped
    ports:
      # Bind to localhost only. Nothing outside the VM can reach this.
      - "127.0.0.1:8888:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://127.0.0.1:8888/
      - UWSGI_WORKERS=2
      - UWSGI_THREADS=4
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "1"
