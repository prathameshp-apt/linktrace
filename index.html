<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LinkTrace</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="simple.css">
<link rel="stylesheet" href="theme.css">
</head>
<body>
<div class="app" id="app" style="visibility:hidden">

  <datalist id="typeList"></datalist>

  <div class="bar">
    <span class="brand">LinkTrace</span>
    <div class="search-wrap">
      <img class="icon search-icon" src="icons/search.svg" alt="" aria-hidden="true" onerror="this.style.display='none'">
      <input id="search" placeholder="Find on board" aria-label="Search entities" autocomplete="off">
    </div>
    <button id="workspaceBtn" class="workspace-btn" style="display:none"></button>
    <div class="menu-wrap">
      <button id="menuBtn" class="icon-btn" aria-haspopup="true" aria-expanded="false" aria-label="More actions" title="More">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg>
      </button>
      <div class="menu" id="menu" hidden>
        <button id="undo">Undo</button>
        <button id="redo">Redo</button>
        <button id="fit">Fit to screen</button>
        <button id="arrange">Auto-arrange board</button>
        <button id="autoLayoutToggle">Auto-layout on add: On</button>
        <hr>
        <button id="json">Export JSON</button>
        <button id="csv">Export CSV</button>
        <button id="load">Import&hellip;</button>
        <button id="backupsBtn">Backups&hellip;</button>
        <input id="file" type="file" accept=".json" hidden>
        <hr>
        <button id="opsecBtn" title="Encryption, panic clear, and what this app does/doesn't protect">Privacy &amp; OPSEC</button>
        <button id="clear" class="danger">Clear board</button>
      </div>
    </div>
  </div>

  <main class="main">
    <div class="view-wrap" id="viewWrap">
    <div class="view" id="view">
      <div class="stage" id="stage">
        <div class="board" id="board">
          <svg class="threads" id="threads"><defs><marker id="lt-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><polygon points="0,1 10,5 0,9"/></marker></defs></svg>
        </div>
      </div>
    </div>

      <div id="empty" class="empty">
        <h2>Start a board</h2>
        <p>Add an entity, then attach sources, confidence and labelled relationships to build out the case.</p>
      </div>
<div class="banner" id="banner">Click another entity to relate it &middot; Esc cancels</div>
    <div class="minimap" id="minimap" aria-label="Board overview">
      <div class="minimap-head">
        <span class="minimap-title" id="minimapTitle">Overview</span>
        <span class="minimap-ctl">
          <button id="mmZoomOut" title="Zoom out" aria-label="Zoom out">&minus;</button>
          <button id="mmZoomIn" title="Zoom in" aria-label="Zoom in">+</button>
          <button id="mmToggle" title="Collapse overview" aria-label="Collapse overview">&#9662;</button>
        </span>
      </div>
      <canvas id="minimapCanvas" width="220" height="140"></canvas>
    </div>
    </div>
    <aside id="side" class="side"></aside>
  </main>

  <div class="livesearch" id="livesearch">
    <div class="ls-panel" id="lsPanel" hidden>
      <div class="ls-head">
        <span class="ls-head-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 20.5 20.5"/></svg>
        </span>
        <div class="ls-head-text">
          <b>Search</b>
          <span class="ls-head-sub">Live results &middot; <span class="ls-section-note" id="lsBackendNote">checking backend&hellip;</span></span>
        </div>
        <span class="ls-head-actions">
          <button id="lsExpand" class="ls-head-btn" aria-pressed="false" title="Make the search panel larger" aria-label="Enlarge search panel">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"/></svg>
          </button>
          <button id="lsClose" class="ls-head-btn" title="Close (Esc)" aria-label="Close search panel">&times;</button>
        </span>
      </div>

      <div class="ls-body" id="lsBody">
      <div class="ls-section ls-section-main">
        <div class="ls-searchbar">
          <svg class="ls-searchbar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 20.5 20.5"/></svg>
          <datalist id="lsHistory"></datalist>
          <input id="lsQuery" list="lsHistory" placeholder="Search a name, email, phone, username&hellip;" aria-label="Search query" autocomplete="off">
          <button id="lsAdvancedToggle" aria-expanded="false" title="Advanced search operators">Advanced</button>
          <button class="primary" id="lsRun">Search</button>
        </div>
        <div class="ls-advanced" id="lsAdvanced" hidden>
          <div class="row">
            <input id="lsAdvSite" placeholder="Site / domain (e.g. linkedin.com)" autocomplete="off">
            <input id="lsAdvFiletype" placeholder="Filetype (e.g. pdf)" autocomplete="off">
          </div>
          <div class="row">
            <input id="lsAdvExact" placeholder="Exact phrase" autocomplete="off">
            <input id="lsAdvExclude" placeholder="Exclude words (comma separated)" autocomplete="off">
          </div>
          <div class="row">
            <input id="lsAdvIntitle" placeholder="Word(s) in title" autocomplete="off">
            <input id="lsAdvIntext" placeholder="Word(s) in page body" autocomplete="off">
          </div>
          <div class="ls-adv-preview" id="lsAdvPreview"></div>
        </div>
        <div class="ls-smart" id="lsSmart" hidden></div>
        <div class="ls-meta-row">
          <div class="ls-engine-wrap">
            <button type="button" id="lsEngineBtn" class="ls-engine-btn" aria-haspopup="listbox" aria-expanded="false" title="Choose the search engine">
              <span id="lsEngineLabel">All engines</span>
              <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
            </button>
            <div class="ls-engine-menu" id="lsEngineMenu" role="listbox" hidden></div>
          </div>
          <div class="ls-target" id="lsTarget"></div>
          <label class="ls-opt" title="Strict: results must contain what you typed (weaker ones are hidden, not lost). Broad: show everything the engines return, best matches first.">
            Match <select id="lsMatch"><option value="strict">Strict</option><option value="broad">Broad</option></select>
          </label>
          <label class="ls-opt" title="Fetches each result page through the local helper to pull its preview photo (also used for entity card photos and details). This contacts the result sites (from the helper, not your browser).">
            <input type="checkbox" id="lsAutoThumbs" checked> Page photos
          </label>
        </div>
        <div id="lsStatus" class="ls-status"></div>
        <div id="lsEngineNote" class="ls-engine-note" hidden></div>
        <div class="ls-groups" id="lsGroups" hidden>
          <div class="ls-groups-chips" id="lsGroupChips"></div>
          <input id="lsFilter" placeholder="Filter results…" aria-label="Filter results" autocomplete="off">
        </div>
        <div class="ls-bulk" id="lsBulk" hidden>
          <label class="ls-bulk-all"><input type="checkbox" id="lsPickAll" aria-label="Select all results"> <span id="lsBulkCount">0 results</span></label>
          <span class="grow"></span>
          <button id="lsBulkClear" type="button" hidden>Clear</button>
          <button id="lsBulkAdd" type="button" class="primary" disabled>Add selected</button>
        </div>
        <div id="lsResultsScroll" class="ls-results-scroll">
          <div id="lsToolResults" class="ls-tool-results"></div>
          <div id="lsResults" class="ls-results"></div>
        </div>
      </div>

      </div>
    </div>
  </div>
</div>


<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<div class="dock" id="dock" role="toolbar" aria-label="Board tools">
  <div class="tool-seg" role="group" aria-label="Board tool">
    <button id="selectTool" class="active" aria-pressed="true" title="Select (V): click, drag and connect entities">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3l14 7-6 2-2 6z"/></svg></button>
    <button id="handTool" aria-pressed="false" title="Pan (H): drag the empty board. Hold Space to pan from anywhere">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V11m0-1V4.5a1.5 1.5 0 0 1 3 0V11m0-4.5a1.5 1.5 0 0 1 3 0V13m0-3.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-1.5a6 6 0 0 1-4.7-2.3L4 14.5a1.6 1.6 0 0 1 2.4-2L8 14"/></svg></button>
  </div>
  <span class="dock-sep" aria-hidden="true"></span>
  <input id="value" placeholder="Add entity" aria-label="New entity value" autocomplete="off">
  <button class="primary" id="add" title="Add entity (Enter)" aria-label="Add entity">+</button>
  <span class="dock-sep" aria-hidden="true"></span>
  <button id="typesBtn" title="Add entity by type / create a custom entity" aria-label="Entity types">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><path d="M16.5 13.5v7M13 17h7"/></svg></button>
  <button id="livesearchToggle" class="ls-toggle" aria-expanded="false" aria-label="Search sources" title="Search sources">
    <img class="icon" src="icons/search.svg" alt="" onerror="this.style.display='none'">
  </button>
</div>

<script src="js/config.js"></script>
<script src="js/state.js"></script>
<script src="js/dom.js"></script>
<script src="js/utils.js"></script>
<script src="js/persistence.js"></script>
<script src="js/modal.js"></script>
<script src="js/opsec.js"></script>
<script src="js/render.js"></script>
<script src="js/toast.js"></script>
<script src="js/helper.js"></script>
<script src="js/inspector.js"></script>
<script src="js/evidence.js"></script>
<script src="js/crud.js"></script>
<script src="js/undo.js"></script>
<script src="js/interaction.js"></script>
<script src="js/physics.js"></script>
<script src="js/navigator.js"></script>
<script src="js/shortcuts.js"></script>
<script src="js/toolbar.js"></script>
<script src="js/layout.js"></script>
<script src="js/selection.js"></script>
<script src="js/types.js"></script>
<script src="js/merge.js"></script>
<script src="js/backup.js"></script>
<script src="js/accountcheck.js"></script>
<script src="js/menu.js"></script>
<script src="js/search.js"></script>
<script src="js/searchcore.js"></script>
<script src="js/livesearch.js"></script>
<script src="js/smartsearch.js"></script>
<script src="js/workspace.js"></script>
<script src="js/onboarding.js"></script>
<script src="js/boot.js"></script>
</body>
</html>
